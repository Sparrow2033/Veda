<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta
            name="viewport"
            content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Veda Graph</title>
    <link rel="stylesheet" href="vis-network.min.css" />
    <style>
        :root {
            color-scheme: dark light;
            --bg: #111315;
            --surface: #171a1f;
            --text: #f4f5f7;
            --muted: #9aa2ad;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }

        body.light {
            --bg: #f6f7fb;
            --surface: #ffffff;
            --text: #121417;
            --muted: #6f7783;
        }

        #graph {
            width: 100%;
            height: 100%;
            background: transparent;
            position: relative;
            overflow: hidden;
        }

        #graph canvas {
            touch-action: none !important;
        }

        #fallback {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
            padding: 24px;
            pointer-events: none;
        }
    </style>
</head>
<body class="dark">
<div id="graph"></div>
<div id="fallback">Не удалось инициализировать граф</div>

<script src="vis-network.min.js"></script>
<script src="graph.js"></script>
</body>
</html>
